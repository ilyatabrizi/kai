<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KAI Coffee — Tehran</title>
<meta name="description" content="KAI Coffee Co. — eight branches, one menu. Order, check in, and collect cashback in the KAI Loyalty leagues.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FCF7F1">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KAI">
<meta property="og:title" content="KAI Coffee — Tehran">
<meta property="og:description" content="Eight branches, one menu. Order, check in, collect cashback.">
<meta property="og:image" content="assets/video/poster.webp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/bodoni.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/IRANYekanXFaNum-Medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css?v=85aaee4b67">
<script>
  // An installed app relaunches at its old scroll offset otherwise, and flashes a
  // half-scrolled page until the router puts it right. Claim it before anything paints.
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  document.documentElement.dataset.js = "1";
</script>
<script type="module" src="js/app.js?v=85aaee4b67"></script>
</head>
<body>

<!-- The opening: the ampersand, then the name. Filled by js/boot.js. -->
<div id="boot" aria-hidden="true">
  <div class="boot-mark" id="boot-mark"></div>
  <div class="boot-word">KAI COFFEE</div>
</div>

<!-- Top bar: the mark, the page title once its large title has scrolled under, the bag. -->
<header id="bar" class="bar">
  <button class="bar-btn bar-round" id="bar-back" type="button" aria-label="Back" hidden></button>
  <a class="bar-home" href="#/" aria-label="KAI Coffee home">
    <span class="bar-mark" id="bar-mark"></span>
    <span class="bar-word">KAI<span class="bar-word-2"> COFFEE</span></span>
  </a>
  <span class="bar-title" id="bar-title" aria-hidden="true"></span>
  <div class="bar-right">
    <button class="bar-btn" id="ci-chip" type="button" aria-label="Check in" data-in="0">
      <span class="ci-dot"></span><span id="ci-chip-label">Check in</span>
    </button>
    <a class="bar-btn bar-round" id="bag-btn" href="#/bag" aria-label="Your bag">
      <span class="bar-bag-ico" id="bag-ico"></span>
      <span class="bar-count" id="bag-count" aria-hidden="true">0</span>
    </a>
  </div>
</header>

<main id="view" class="view" aria-live="polite"></main>

<!-- The running total, above the tab bar, whenever there is something in the bag. -->
<a id="dock" class="dock" href="#/bag" hidden>
  <span class="dock-n" id="dock-n">0</span>
  <span class="dock-t">View bag</span>
  <span class="dock-sum money" id="dock-sum"></span>
</a>

<!-- Five tabs on glass. The pill behind the active one slides. -->
<nav id="tabs" class="tabs" aria-label="Primary">
  <span class="tabs-ink" id="tabs-ink" aria-hidden="true"></span>
  <a class="tab" data-tab="home" href="#/"><span class="tab-ico"></span><span class="tab-l">Home</span></a>
  <a class="tab" data-tab="menu" href="#/menu"><span class="tab-ico"></span><span class="tab-l">Menu</span></a>
  <a class="tab" data-tab="checkin" href="#/checkin"><span class="tab-ico"></span><span class="tab-l">Check in</span></a>
  <a class="tab" data-tab="branches" href="#/branches"><span class="tab-ico"></span><span class="tab-l">Branches</span></a>
  <a class="tab" data-tab="profile" href="#/profile"><span class="tab-ico"></span><span class="tab-l">You</span></a>
</nav>

<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite" aria-atomic="true"></div>

<noscript><p style="padding:24px;font:15px/1.5 system-ui">KAI Coffee needs JavaScript to run.</p></noscript>
</body>
</html>
